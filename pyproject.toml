[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "krusch-nexus"
version = "0.2.4"
description = "Air-Gapped Universal Document Ingestion Engine & Citation Spine"
readme = "README.md"
authors = [{ name = "kruschdev", email = "kruschdev@users.noreply.github.com" }]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "sqlalchemy>=2.0.25",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.9",
    "pgvector>=0.2.4",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
    "requests>=2.31.0",
    "watchdog>=4.0.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]
# Note: OCR requires host system packages: `sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-eng`
ocr = [
    "Pillow>=10.0.0",
]

[project.scripts]
nexus = "krusch_nexus.cli:main"
nexus-daemon = "krusch_nexus.daemon:main"
nexus-mcp = "krusch_nexus.mcp:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["krusch_nexus*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
norecursedirs = ["scratch", ".agent", "mcp_env", ".git"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    ".venv",
    "__pycache__",
    "alembic",
    "scratch",
    ".agent"
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "E712", "W293"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "F401", "F841"]
"scripts/*" = ["E402", "F401"]

