[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "krusch-nexus"
version = "1.0.0"
description = "Universal Closed-Loop Document Ingestion & Corpus Indexing Engine"
readme = "README.md"
authors = [{ name = "kruschDev", email = "krusch@users.noreply.github.com" }]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "sqlalchemy>=2.0.25",
    "psycopg2-binary>=2.9.9",
    "pgvector>=0.2.4",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
rerank = [
    "sentence-transformers>=2.2.0",
]
llama = [
    "llama-index>=0.11.0",
    "llama-index-vector-stores-postgres",
    "llama-index-llms-ollama",
    "llama-index-embeddings-ollama",
]

[project.scripts]
nexus-daemon = "src.backend.ingest_daemon:main"
nexus-mcp = "src.backend.mcp_server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
