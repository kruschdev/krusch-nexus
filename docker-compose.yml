services:
  db:
    image: ankane/pgvector:v0.5.1
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-krusch_nexus_db}
    networks:
      - nexus_net
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-krusch_nexus_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    networks:
      - nexus_net
    volumes:
      - ./src/backend:/app/src/backend
      - ./ingest_watch:/app/ingest_watch
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-krusch_nexus_db}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_EMBED_HOST=${OLLAMA_EMBED_HOST:-http://host.docker.internal:11434}
      - PYTHONUNBUFFERED=1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  ingest-worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    networks:
      - nexus_net
    volumes:
      - ./src/backend:/app/src/backend
      - ./ingest_watch:/app/ingest_watch
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-krusch_nexus_db}
      - OLLAMA_EMBED_HOST=${OLLAMA_EMBED_HOST:-http://host.docker.internal:11434}
      - PYTHONUNBUFFERED=1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "src.backend.ingest_daemon"]
    restart: unless-stopped

  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile.backend
    networks:
      - nexus_net
    volumes:
      - ./src/backend:/app/src/backend
    ports:
      - "127.0.0.1:8002:8002"
    env_file:
      - .env
    environment:
      - MCP_TRANSPORT=sse
      - MCP_PORT=8002
      - MCP_HOST=0.0.0.0
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-krusch_nexus_db}
      - OLLAMA_EMBED_HOST=${OLLAMA_EMBED_HOST:-http://host.docker.internal:11434}
      - PYTHONUNBUFFERED=1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "src.backend.mcp_server"]
    restart: unless-stopped

volumes:
  pgdata:

networks:
  nexus_net:
    driver: bridge
