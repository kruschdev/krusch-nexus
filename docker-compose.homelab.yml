# Homelab Fleet Extension for KruschNexus
# Usage: docker compose -f docker-compose.yml -f docker-compose.homelab.yml up -d

services:
  data-flywheel:
    build:
      context: .
      dockerfile: Dockerfile.backend
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - nexus_net
    volumes:
      - ./src/backend:/app/src/backend
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - DBOS_DATABASE_URL=postgres://openclaw:openclaw_password@host.docker.internal:5434/kruschdb
      - PYTHONUNBUFFERED=1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "src.backend.data_flywheel"]
    restart: unless-stopped

  backfill-worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - nexus_net
    volumes:
      - ./src/backend:/app/src/backend
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://openclaw:openclaw_password@host.docker.internal:5434/kruschdb
      - PYTHONUNBUFFERED=1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["python", "-m", "src.backend.blob_summary_backfill_gemini"]
    restart: "no"

  embed-worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    networks:
      - nexus_net
    volumes:
      - ./src/backend:/app/src/backend
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://openclaw:openclaw_password@host.docker.internal:5434/kruschdb
      - PYTHONUNBUFFERED=1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["python", "-m", "src.backend.embedding_backfill"]
    restart: unless-stopped

  personal-agent:
    build:
      context: ../..
      dockerfile: projects/krusch-nexus/Dockerfile.agent
    networks:
      - nexus_net
    ports:
      - "3005:3000"
    volumes:
      - ./src/agent:/app/projects/krusch-nexus/src/agent
      - /app/projects/krusch-nexus/src/agent/node_modules
      - ./src/backend:/app/projects/krusch-nexus/src/backend
      - ./docker-compose.yml:/app/projects/krusch-nexus/docker-compose.yml
      - ./.env:/app/projects/krusch-nexus/.env
      - ../../lib:/app/lib
      - /app/lib/node_modules
      - ../../projects/krusch-infra-mcp:/app/projects/krusch-infra-mcp
      - ../../projects/krusch-sentinel-mcp:/app/projects/krusch-sentinel-mcp
      - ../../projects/krusch-context-mcp:/app/projects/krusch-context-mcp
      - ../../projects/krusch-sequential-mcp:/app/projects/krusch-sequential-mcp
      - ../../projects/pocketlawyer-mcp-full:/app/projects/pocketlawyer-mcp-full
      - ../../projects/pg-git:/app/projects/pg-git
      - /var/run/docker.sock:/var/run/docker.sock
    env_file: .env
    environment:
      - DBOS_DATABASE_URL=postgres://openclaw:openclaw_password@host.docker.internal:5434/kruschdb
      - PERSONA_OLLAMA_URL=http://host.docker.internal:11434
      - EXECUTOR_OLLAMA_URL=http://host.docker.internal:11434
      - PERSONA_MODEL=qwen2.5-coder:7b
      - EXECUTOR_MODEL=qwen2.5-coder:7b
      - PYTHONUNBUFFERED=1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
