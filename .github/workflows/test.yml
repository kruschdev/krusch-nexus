name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install system dependencies (Poppler & Tesseract)
      run: |
        sudo apt-get update
        sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-eng

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run Linters & Type Audits
      run: |
        ruff check src/
        mypy src/krusch_nexus/ --ignore-missing-imports

    - name: Homelab Path & Secret Hygiene Guard
      run: |
        echo "Verifying no absolute homelab machine paths exist in source or tests..."
        ! grep -rn --exclude-dir=__pycache__ "/home/krusch" src/

    - name: Air-Gap Vendor Independence Guard
      run: |
        echo "Verifying zero external cloud vendor references in core package..."
        ! grep -rn -i -E "google|gemini|openai|anthropic" src/krusch_nexus/

    - name: Generate Fixtures
      run: |
        python tests/fixtures/create_fixtures.py

    - name: Quickstart Smoke Test (README 3-line sample)
      env:
        DATABASE_URL: "sqlite:///:memory:"
        OLLAMA_BASE_URL: "http://127.0.0.1:11434"
      run: |
        python -c "from krusch_nexus import NexusClient; client = NexusClient(); report = client.ingest('tests/fixtures/sample_contract.pdf', workspace='CIQuickstart'); hits = client.search('termination for breach', workspace='CIQuickstart'); assert len(hits) > 0, 'Quickstart returned 0 hits'; print(f'CI Quickstart OK: {hits[0].citation}')"

    - name: Run Layered Test Suite & Citation Benchmark
      env:
        DATABASE_URL: "sqlite:///:memory:"
        OLLAMA_BASE_URL: "http://127.0.0.1:11434"
      run: |
        python -m pytest tests/ -v

    - name: Generate Machine-Readable Evaluation Report
      env:
        DATABASE_URL: "sqlite:///:memory:"
        OLLAMA_BASE_URL: "http://127.0.0.1:11434"
      run: |
        python -m krusch_nexus.eval_report eval_report.json
        cat eval_report.json

    - name: Upload Evaluation Report Artifact
      uses: actions/upload-artifact@v4
      with:
        name: eval-report-${{ matrix.python-version }}
        path: eval_report.json
