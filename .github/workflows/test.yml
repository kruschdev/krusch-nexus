name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install system dependencies (Poppler & Tesseract)
      run: |
        sudo apt-get update
        sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-eng

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run Linters & Type Audits
      run: |
        ruff check src/

    - name: Homelab Path & Secret Hygiene Guard
      run: |
        echo "Verifying no absolute homelab machine paths exist in source or tests..."
        ! grep -rn --exclude-dir=__pycache__ "/home/krusch" src/

    - name: Generate Fixtures
      run: |
        python tests/fixtures/create_fixtures.py

    - name: Run Layered Test Suite & Citation Benchmark
      env:
        DATABASE_URL: "sqlite:///:memory:"
        OLLAMA_BASE_URL: "http://127.0.0.1:11434"
      run: |
        python -m pytest tests/ -v
