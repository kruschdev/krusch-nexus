name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: nexus_ci_user
          POSTGRES_PASSWORD: nexus_ci_password_42
          POSTGRES_DB: nexus_ci_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install system dependencies (Poppler & Tesseract)
      run: |
        sudo apt-get update
        sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-eng

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run Linters & Type Audits
      run: |
        ruff check src/
        mypy src/krusch_nexus/ --ignore-missing-imports

    - name: Homelab Path & Secret Hygiene Guard
      run: |
        echo "Verifying no absolute homelab machine paths exist in source, docs, tests, or markdown..."
        ! grep -rn --exclude-dir=__pycache__ --exclude-dir=.git "/home/krusch" src/ docs/ tests/ *.md

    - name: Air-Gap Vendor Independence Guard
      run: |
        echo "Verifying zero external cloud vendor references in core package..."
        ! grep -rn -i -E "google|gemini|openai|anthropic" src/krusch_nexus/

    - name: Generate Fixtures
      run: |
        python tests/fixtures/create_fixtures.py

    - name: Run Database Migrations on PostgreSQL 16
      env:
        DATABASE_URL: "postgresql://nexus_ci_user:nexus_ci_password_42@127.0.0.1:5432/nexus_ci_db"
      run: |
        alembic upgrade head

    - name: Run Unit Test Suite (SQLite In-Memory)
      env:
        DATABASE_URL: "sqlite:///:memory:"
        NEXUS_EMBED_BACKEND: "dummy"
      run: |
        python -m pytest tests/unit/ -v

    - name: Run Integration Tests on PostgreSQL 16 Container (HNSW, GIN, RLS)
      env:
        DATABASE_URL: "postgresql://nexus_ci_user:nexus_ci_password_42@127.0.0.1:5432/nexus_ci_db"
        NEXUS_EMBED_BACKEND: "dummy"
      run: |
        python -m pytest tests/integration/ -v

    - name: Run Evaluation Benchmark Suites
      env:
        DATABASE_URL: "postgresql://nexus_ci_user:nexus_ci_password_42@127.0.0.1:5432/nexus_ci_db"
        NEXUS_EMBED_BACKEND: "dummy"
      run: |
        python -m pytest tests/eval/ -v
        python -m krusch_nexus.eval_report eval_report.json
        cat eval_report.json

    - name: Upload Evaluation Report Artifact
      uses: actions/upload-artifact@v4
      with:
        name: eval-report-${{ matrix.python-version }}
        path: eval_report.json
